# Example configuration for offline RL training with JAX backend
# This follows the unified configuration schema from the PRD (§3.1)

[backend]
type = "jax"
mode = "offline"

[dataset]
path = "data/sample_traces.jsonl"
schema_version = "v1"
batch_size = 2
shuffle = true

[algorithm]
name = "dpo"
learning_rate = 1e-5
beta = 0.1  # DPO beta parameter

[model]
name = "gpt2"
trust_remote_code = false

[output]
output_dir = "./output"
max_steps = 10
checkpoint_every = 5
eval_every = 10

