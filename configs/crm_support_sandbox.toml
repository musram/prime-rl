# CRM Support Sandbox Configuration
# Example configuration for training on CRM customer service workflows

[backend]
type = "torch"
mode = "online"

[algorithm]
name = "grpo"
learning_rate = 1e-5
clip_epsilon = 0.2
value_coef = 0.5
entropy_coef = 0.01

[model]
name = "meta-llama/Llama-3.1-8B-Instruct"
trust_remote_code = false

[environment]
type = "crm_support"
num_customers = 10
num_agents = 3
num_tickets = 5

[verifier]
type = "crm_rubric"

[output]
output_dir = "outputs/crm_support_sandbox"
max_steps = 1000
checkpoint_every = 100
eval_every = 50

