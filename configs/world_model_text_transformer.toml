# World Model Training Configuration - Text Transformer
# Trains a transformer-based world model for text observations

[world_model]
algorithm = "text_transformer"
state_representation = "text"
algorithm_config = {
    max_length = 512,
    d_model = 128,
    nhead = 4,
    num_layers = 2,
    learning_rate = 0.0001
}

[training]
data_path = "data/text_traces.jsonl"
output_dir = "outputs/world_models/text_transformer"
num_epochs = 20
batch_size = 16
validation_split = 0.1

